<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <title>Ordenes de Reparación</title>
</head>
<body class="p-8">
    <div id="navbar-container"></div>

    <div id="vista-tabla">
            <div class="flex flex-col md:flex-row justify-between items-center mb-4 gap-4">
                <button id="btnNuevaOrden" class="btn btn-primary">Insertar nueva orden</button>

            <!--Barra de búsqueda -->
            <div class="w-full md:w-1/2 flex">
                <input type="text" id="inputBuscar" placeholder="Buscar por cliente, técnico, modelo, status o fecha..." class="w-full border border-gray-300 rounded-l-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button id="btnBuscar" class="bg-indigo-600 text-white px-4 py-2 rounded-r-lg hover:bg-indigo-700 transition">
                    Buscar
                </button>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="table table-zebra w-full">
                <thead>
                    <tr class="bg-gray-100 text-gray-700">
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="id_order">
                            ID <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="customer_name">
                            Nombre del Cliente <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="device_type">
                            Tipo de Dispositivo <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="service_type">
                            Servicio <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="technician_name">
                            Técnico <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="brand_model">
                            Marca de Dispositivo <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th> 

                        <th>Reporte</th>
                        <th>Diagnostico</th>

                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="final_price">
                            Precio Final <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="current_status">
                            Status <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="created_at">
                            Fecha de creación <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th> 
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table> 
        </div>
        <div id="paginacion-container" class="flex justify-between items-center mt-6 px-2"></div>
    </div>

<div id="vista-formulario" class="hidden">
    <div class="flex justify-start mb-4">
        <button id="btnVolver" class="btn btn-secondary">← Volver a la tabla</button>
    </div>
    
    <h2 id="tituloFormulario" class="text-2xl font-bold mb-6">Nueva Orden de Reparación</h2>

    <form id="formOrden" class="flex flex-col gap-4 max-w-lg">
        
        <input type="hidden" name="id_order" id="id_order">
        
        <select name="id_customer" class="select select-bordered w-full" required></select>
        <select name="id_device_type" class="select select-bordered w-full" required></select>
        <select name="id_service_type" class="select select-bordered w-full" required></select>
        <select name="id_user" class="select select-bordered w-full" required></select>
        
        <input type="text" name="brand_model" placeholder="Marca de Dispositivo" class="input input-bordered w-full" required>
        <textarea name="reported_fault" placeholder="Reporte" class="textarea textarea-bordered w-full" required></textarea>
        <textarea name="technical_diagnosis" placeholder="Diagnóstico" class="textarea textarea-bordered w-full"></textarea>
        <input type="number" step="0.01" name="final_price" placeholder="Precio Final" class="input input-bordered w-full" required>
        
        <select name="id_status" class="select select-bordered w-full" required></select>
        
        <button type="submit" class="btn btn-primary">Guardar Orden</button>
    </form>
</div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script type="module" src="../js/repair_orders.js"></script>
    <script src="../js/navbar.js"></script>
</body>
</html>
