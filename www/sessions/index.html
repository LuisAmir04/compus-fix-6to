<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <title>Registro de Sesiones</title>
</head>
<body class="p-8 bg-slate-50">
    <div id="navbar-container"></div>

    <div id="vista-tabla">
        <div class="mb-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-bold text-gray-800">Registro de Sesiones</h1>

            <div class="w-full md:w-1/3 flex">
                <input type="text" id="inputBuscar" placeholder="Buscar por nombre de usuario..." class="w-full border border-gray-300 rounded-l-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button id="btnBuscar" class="bg-indigo-600 text-white px-4 py-2 rounded-r-lg hover:bg-indigo-700 transition">
                    Buscar
                </button>
            </div>
        </div>

        <div class="overflow-x-auto bg-white rounded-xl shadow-sm border border-gray-200">
            <table class="table table-zebra w-full">
                <thead class="bg-gray-100 text-gray-700">
                    <tr>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="id_session">
                            ID <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="username">
                            Usuario <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="created_at">
                            Inicio de sesión <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="expires_at">
                            Expira / Cerró <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
        <div id="paginacion-container" class="flex justify-between items-center mt-6 px-2"></div>
    </div>

    <script src="../js/navbar.js"></script>
    <script type="module" src="../js/sessions.js"></script>
</body>
</html>
