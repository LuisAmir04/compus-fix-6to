<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <title>Registros de Caja</title>
</head>
<body class="p-8">

    <div id="navbar-container"></div>

<div id="tableSection">
        
        <!-- 1. Controles Superiores (Botón y Buscador) -->
        <div class="mb-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <button id="btnAgregar" class="btn btn-primary">
                Agregar
            </button>

            <div class="w-full md:w-1/2 flex">
                <input type="text" id="inputBuscar" placeholder="Buscar por cajero, fecha de apertura o cierre..." class="w-full border border-gray-300 rounded-l-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <button id="btnBuscar" class="bg-indigo-600 text-white px-4 py-2 rounded-r-lg hover:bg-indigo-700 transition">
                    Buscar
                </button>
            </div>
        </div>

        <!-- 2. La Tabla y su Paginación -->
        <div class="overflow-x-auto">
            <table class="table table-zebra w-full">
                <thead>
                    <tr>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="id_cut">
                            ID Corte <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="cashier_name">
                            Cajero <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="opening_time">
                            Hora de entrada <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="initial_cash">
                            Dinero inicial <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="closing_time">
                            Hora de cierre <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th class="cursor-pointer hover:bg-gray-200 select-none sortable transition-colors" data-sort="declared_cash">
                            Dinero declarado <span class="sort-icon text-gray-400 text-xs ml-1">▴▾</span>
                        </th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
            <div id="paginacion-container" class="flex justify-between items-center mt-6 px-2"></div>
        </div>
    </div>

    <div id="addSection" class="hidden mt-10">
        <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow">
            <h2 class="text-2xl font-bold mb-4">Agregar Corte de Caja</h2>

            <label class="block mb-2">Usuario</label>
            <select id="id_user" class="select select-bordered w-full mb-4">
                <option value="">Seleccione un usuario</option>
            </select>

            <label class="block mb-2">Dinero inicial</label>
            <input type="number" id="initial_cash" class="input input-bordered w-full mb-4">

            <div class="flex gap-3">
                <button id="btnGuardar" type="button" class="btn btn-primary">Guardar</button>
                <button id="btnCancelarAgregar" type="button" class="btn btn-ghost">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="editSection" class="hidden mt-10">
        <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow">
            <h2 class="text-2xl font-bold mb-4">Editar Corte de Caja</h2>

            <input type="hidden" id="edit_id_cut">

            <label class="block mb-2">Dinero inicial</label>
            <input type="number" id="edit_initial_cash" class="input input-bordered w-full mb-4">

            <label class="block mb-2">Dinero declarado</label>
            <input type="number" id="edit_declared_cash" class="input input-bordered w-full mb-4">

            <div class="flex gap-3">
                <button id="btnActualizar" type="button" class="btn btn-primary">Guardar cambios</button>
                <button id="btnCancelar" type="button" class="btn btn-error">Cancelar</button>
            </div>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/navbar.js"></script>
    <script type="module" src="../js/cash_register.js"></script>
</body>
</html>
